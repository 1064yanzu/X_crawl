<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>X_crawl 启动中</title>
  <style>
    :root {
      color-scheme: light;
      --bg: oklch(0.975 0.008 82);
      --ink: oklch(0.22 0.020 55);
      --ink-muted: oklch(0.48 0.014 60);
      --ink-subtle: oklch(0.62 0.012 65);
      --line: oklch(0.88 0.012 75);
      --accent: oklch(0.52 0.155 32);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: oklch(0.185 0.012 60);
        --ink: oklch(0.94 0.012 80);
        --ink-muted: oklch(0.70 0.012 75);
        --ink-subtle: oklch(0.55 0.012 70);
        --line: oklch(0.32 0.012 65);
        --accent: oklch(0.72 0.135 35);
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-serif, "Times New Roman", "Songti SC", serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      box-sizing: border-box;
      height: 100%;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      -webkit-app-region: drag;
    }
    .eyebrow {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }
    .rule {
      height: 2px;
      width: 32px;
      background: var(--accent);
      margin-top: 12px;
    }
    .title {
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.012em;
      line-height: 1.1;
      margin-top: 16px;
    }
    .title em {
      font-style: italic;
      color: var(--accent);
      font-weight: 400;
    }
    .subtitle {
      margin-top: 10px;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
      font-size: 12.5px;
      color: var(--ink-muted);
      line-height: 1.65;
      max-width: 28ch;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .spinner {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    .status {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      min-height: 14px;
    }
    .footer {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 9.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="eyebrow">第 01 期 · 封面</div>
      <div class="rule"></div>
      <div class="title">X_crawl<br/><em>正在启动</em></div>
      <div class="subtitle">多平台数据采集引擎。请稍候，服务正在初始化。</div>
    </div>

    <div>
      <div class="status-row">
        <span class="spinner"></span>
        <span class="status" id="status">正在初始化爬虫服务…</span>
      </div>
      <div class="footer" style="margin-top: 14px;">X_crawl · 2026</div>
    </div>
  </div>
  <script>
    const el = document.getElementById('status');
    if (window.xcrawlSplash && typeof window.xcrawlSplash.onStatus === 'function') {
      window.xcrawlSplash.onStatus(function (text) { el.textContent = text; });
    }
  </script>
</body>
</html>
