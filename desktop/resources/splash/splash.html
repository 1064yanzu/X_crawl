<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>X_crawl 启动中</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #0c0d10;
      color: #f4f4f5;
    }
    .wrap {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 700; color: white;
      box-shadow: 0 12px 32px rgba(239, 68, 68, 0.35);
    }
    .title { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
    .status {
      font-size: 13px; color: #a1a1aa; min-height: 18px;
    }
    .spinner {
      width: 26px; height: 26px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">X</div>
    <div class="title">X_crawl 桌面端</div>
    <div class="spinner"></div>
    <div class="status" id="status">正在初始化爬虫服务...</div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const el = document.getElementById('status');
    ipcRenderer.on('splash:status', (_e, text) => { el.textContent = text; });
  </script>
</body>
</html>
