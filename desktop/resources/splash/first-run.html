<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>需要安装 Chrome 浏览器</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #fafafa;
      color: #18181b;
      height: 100%;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #09090b; color: #f4f4f5; }
      .card { background: #18181b; border-color: #27272a !important; }
      .row a { background: #27272a; color: #f4f4f5; }
      .row a:hover { background: #3f3f46; }
    }
    .container {
      max-width: 520px; margin: 0 auto;
      padding: 56px 32px;
    }
    .card {
      background: white;
      border: 1px solid #e4e4e7;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.06);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px; font-weight: 600;
    }
    p {
      margin: 0 0 16px;
      font-size: 14px; line-height: 1.7;
      color: #52525b;
    }
    .row {
      display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap;
    }
    .row a {
      flex: 1; min-width: 200px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 16px;
      background: #f4f4f5;
      color: #18181b;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px; font-weight: 500;
      transition: background 0.15s;
    }
    .row a:hover { background: #e4e4e7; }
    .row a.primary {
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: white;
    }
    .row a.primary:hover { filter: brightness(1.06); }
    button.retry {
      margin-top: 22px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #18181b;
      color: white;
      font-size: 14px; font-weight: 500;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      button.retry { background: #f4f4f5; color: #18181b; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>需要安装 Chrome 或 Edge 浏览器</h1>
      <p>
        X_crawl 通过接管系统已安装的 Chromium 内核浏览器来抓取 X / 微博 / YouTube 数据，
        所以需要你的电脑上先装好 <strong>Google Chrome</strong> 或 <strong>Microsoft Edge</strong>。
      </p>
      <p>请点击下面的链接下载安装，完成后回到本窗口点击「我已安装，重新检测」。</p>
      <div class="row">
        <a class="primary" href="https://www.google.com/chrome/" target="_blank" rel="noopener">
          下载 Google Chrome
        </a>
        <a href="https://www.microsoft.com/edge/download" target="_blank" rel="noopener">
          下载 Microsoft Edge
        </a>
      </div>
      <button class="retry" id="retry">我已安装，重新检测</button>
    </div>
  </div>
  <script>
    const { ipcRenderer, shell } = require('electron');
    document.getElementById('retry').addEventListener('click', () => {
      ipcRenderer.send('first-run:retry');
    });
    document.querySelectorAll('a[target="_blank"]').forEach((a) => {
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        shell.openExternal(a.href);
      });
    });
  </script>
</body>
</html>
