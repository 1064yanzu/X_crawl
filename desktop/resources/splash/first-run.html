<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>需要安装 Chrome 浏览器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: oklch(0.975 0.008 82);
      --surface: oklch(0.992 0.005 82);
      --ink: oklch(0.22 0.020 55);
      --ink-muted: oklch(0.48 0.014 60);
      --ink-subtle: oklch(0.62 0.012 65);
      --line: oklch(0.88 0.012 75);
      --line-strong: oklch(0.82 0.014 70);
      --accent: oklch(0.52 0.155 32);
      --accent-strong: oklch(0.42 0.16 30);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: oklch(0.185 0.012 60);
        --surface: oklch(0.215 0.012 60);
        --ink: oklch(0.94 0.012 80);
        --ink-muted: oklch(0.70 0.012 75);
        --ink-subtle: oklch(0.55 0.012 70);
        --line: oklch(0.32 0.012 65);
        --line-strong: oklch(0.40 0.014 65);
        --accent: oklch(0.72 0.135 35);
        --accent-strong: oklch(0.80 0.140 38);
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 64px 40px;
    }
    .eyebrow {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }
    .rule {
      height: 2px;
      width: 36px;
      background: var(--accent);
      margin-top: 14px;
    }
    h1 {
      font-family: ui-serif, "Times New Roman", "Songti SC", serif;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.012em;
      line-height: 1.15;
      margin: 16px 0 4px;
    }
    .lead {
      font-size: 14.5px;
      color: var(--ink-muted);
      line-height: 1.8;
      margin: 18px 0;
      max-width: 60ch;
    }
    strong { color: var(--ink); font-weight: 600; }
    hr.sep {
      border: 0;
      height: 1px;
      background: var(--line);
      margin: 28px 0;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .row a {
      flex: 1;
      min-width: 220px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid var(--line-strong);
      color: var(--ink);
      text-decoration: none;
      font-size: 13.5px;
      transition: border-color 200ms cubic-bezier(0.22, 1, 0.36, 1), color 200ms;
    }
    .row a::after {
      content: "→";
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: var(--ink-subtle);
      transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1), color 200ms;
    }
    .row a:hover {
      border-color: var(--accent);
      color: var(--accent-strong);
    }
    .row a:hover::after {
      color: var(--accent);
      transform: translateX(2px);
    }
    .row a.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .row a.primary::after { color: var(--bg); }
    .row a.primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }
    button.retry {
      margin-top: 26px;
      padding: 14px 22px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity 200ms;
    }
    button.retry:hover { opacity: 0.85; }
    .footer {
      margin-top: 36px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">第 01 期 · 提示</div>
    <div class="rule"></div>
    <h1>需要先安装 Chrome 或 Edge</h1>
    <p class="lead">
      X_crawl 通过接管系统已安装的 Chromium 内核浏览器来抓取
      <strong>X / 微博 / YouTube</strong> 数据。请先安装下列任一浏览器，再回到这里继续。
    </p>

    <hr class="sep" />

    <div class="row">
      <a class="primary" href="https://www.google.com/chrome/" target="_blank" rel="noopener">下载 Google Chrome</a>
      <a href="https://www.microsoft.com/edge/download" target="_blank" rel="noopener">下载 Microsoft Edge</a>
    </div>

    <button class="retry" id="retry">我已安装,重新检测</button>

    <p class="footer">X_crawl · Multi-platform Crawler · 2026</p>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', () => {
      window.xcrawlFirstRun && window.xcrawlFirstRun.retryDetect();
    });
    document.querySelectorAll('a[target="_blank"]').forEach((a) => {
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        window.xcrawlFirstRun && window.xcrawlFirstRun.openExternal(a.href);
      });
    });
  </script>
</body>
</html>
